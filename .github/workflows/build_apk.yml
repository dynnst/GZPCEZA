name: Build Cezam Calculator APK

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/cezam_calculator/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Packages
        working-directory: mobile/cezam_calculator
        run: |
          flutter clean
          flutter pub get

      - name: Build Android APK
        working-directory: mobile/cezam_calculator
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Locate and Prepare APK
        run: |
          NEW_APK=$(find . -name "app-release.apk" | head -n 1)
          if [ -z "$NEW_APK" ]; then
            echo "Searching wider for app-release.apk..."
            NEW_APK=$(find /home/runner/work -name "app-release.apk" | head -n 1)
          fi
          if [ -z "$NEW_APK" ]; then
            echo "ERROR: app-release.apk was not found!"
            exit 1
          fi
          echo "Newly built APK found at: $NEW_APK"
          mkdir -p Apk
          cp -f "$NEW_APK" Apk/cezam-calculator.apk
          ls -lh Apk/cezam-calculator.apk
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f Apk/cezam-calculator.apk
          if ! git diff --staged --quiet; then
            git commit -m "chore(apk): update release APK to latest build [skip ci]"
            git push origin main
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cezam_Calculator_Mobil_APK
          path: Apk/cezam-calculator.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: mobile-latest
          name: "Cezam Calculator Mobil APK (Son Sürüm)"
          body: |
            ### 📱 Cezam Calculator Mobil Android APK (v0.3.3)
            - **Mevzuat & Genelgeler Kılavuzu:** Göç İdaresi 2020/17 genelgesi ve 6458 sayılı kanun rehberi kurumsal dille entegre edildi.
            - **Sahtecilik & Belge İnceleme Köprüsü:** Sahtecilik mobil masasına ve web portalına doğrudan geçiş köprüsü eklendi.
            - **Tutanak ve Form Standartları:** Cezai tebliğ ve harç döküm metinleri güncellendi.
            - **Web & Mobil Motor Eşitlemesi:** Web ve mobil motorlar birebir aynı hesaplama sonuçlarını üretir.
          files: Apk/cezam-calculator.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
