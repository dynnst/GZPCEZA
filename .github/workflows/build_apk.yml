name: Build Cezam Calculator APK

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/cezam_calculator/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Packages
        working-directory: mobile/cezam_calculator
        run: flutter pub get

      - name: Run Tests
        working-directory: mobile/cezam_calculator
        run: flutter test

      - name: Build Android APK
        working-directory: mobile/cezam_calculator
        run: flutter build apk --release

      - name: Rename APK
        run: cp mobile/cezam_calculator/build/app/outputs/flutter-apk/app-release.apk mobile/cezam_calculator/build/app/outputs/flutter-apk/cezam-calculator.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cezam_Calculator_Mobil_APK
          path: mobile/cezam_calculator/build/app/outputs/flutter-apk/cezam-calculator.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: "Cezam Calculator Mobil APK (Son Sürüm)"
          body: |
            ### 📱 Cezam Calculator Mobil Android APK
            - **Parçalı Seferler & Normal Hesaplama Düzeltmesi:** Dereköy KHK ve tüm sınır kapıları için parçalı seferler 180 gün penceresi tarafından kırpılmadan eksiksiz toplanır.
            - **Web & Mobil Motor Eşitlemesi:** Web ve mobil motorlar birebir aynı hesaplama sonuçlarını verir.
            
            Aşağıdaki `cezam-calculator.apk` dosyasına telefonunuzdan tıklayarak doğrudan indirebilir ve kurabilirsiniz.
          files: mobile/cezam_calculator/build/app/outputs/flutter-apk/cezam-calculator.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
